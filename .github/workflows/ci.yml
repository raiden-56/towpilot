name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: towpilot
          POSTGRES_PASSWORD: towpilot
          POSTGRES_DB: towpilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U towpilot" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://towpilot:towpilot@localhost:5432/towpilot_test?schema=public
      TEST_DATABASE_URL: postgresql://towpilot:towpilot@localhost:5432/towpilot_test?schema=public
      JWT_ACCESS_SECRET: ci-only-secret-ci-only-secret-ci-only-1234
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - name: Typecheck
        run: npm run typecheck
      - name: API tests (unit + integration against PostgreSQL)
        run: npm run test -w apps/api
      - name: Web tests
        run: npm run test -w apps/web
      - name: Build
        run: npm run build
      - name: Prisma schema drift check
        run: npx prisma migrate diff --from-migrations apps/api/prisma/migrations --to-schema-datamodel apps/api/prisma/schema.prisma --shadow-database-url "$DATABASE_URL" --exit-code || (echo "Schema and migrations differ" && exit 1)
        working-directory: .

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/api/Dockerfile -t towpilot-api .
      - run: docker build -f apps/web/Dockerfile -t towpilot-web .
